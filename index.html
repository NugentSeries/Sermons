<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>A Kingdom Not of This World</title>

<style>

body{
    margin:0;
    font-family: Georgia, "Times New Roman", serif;
    background:#f6f1df;
    color:#183a22;
}

.container{
    max-width:900px;
    margin:auto;
    padding:50px 30px;
    text-align:center;
}

h1{
    font-size:3.6em;
    margin-bottom:10px;
    color:#1f4028;
}

h2{
    font-weight:normal;
    color:#7b5b1c;
    margin-top:0;
}

.speaker{
    margin-top:8px;
    margin-bottom:35px;
    font-weight:normal;
    color:#1f4028;
}


.card{

    margin-top:50px;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 25px rgba(0,0,0,.15);

}

.session{

    color:#9a7416;
    letter-spacing:2px;
    text-transform:uppercase;
    font-family: Arial, Helvetica, sans-serif;
    font-size:1.5em;
    font-weight:normal;

}

.title{

    font-size:2.2em;
    margin:15px 0;

}

.reference{

    font-style:italic;
    color:#666;

}

.countdown{

    margin:40px 0;
    font-size:3em;
    font-weight:bold;
    color:#275d36;

}

.button{

    display:inline-block;
    background:#24552f;
    color:white;
    padding:18px 40px;
    text-decoration:none;
    border-radius:8px;
    font-size:1.2em;
    transition:.3s;

}

.button:hover{

    background:#16351d;

}

.footer{

    margin-top:40px;

}

.event-date{

    font-family: Arial, Helvetica, sans-serif;
    font-size:1.5em;
    color:#24552f;
    font-weight:600;
    margin-bottom:10px;

}

.event-time{

    font-family: Arial, Helvetica, sans-serif;
    font-size:1.5em;
    color:#24552f;

}

@media (max-width:700px){

h1{
font-size:2.3em;
}

.title{
font-size:1.5em;
}

.countdown{
font-size:2em;
}

}

</style>

</head>

<body>

<div class="container">

<h1>A Kingdom Not of This World</h1>

<h2>A Midweek Sermon Series in 7 Sermons from Matthew 13</h2>

<h2 class="speaker">
By Pastor Ron Nugent
</h2>

<div class="card">

<div class="session">
Session 1
</div>

<div class="title">
A Very Different Kingdom
</div>

<div class="reference">
The Parable of the Sower (Matthew 13:1–9, 18–23)
</div>

<div class="countdown" id="countdown">
Loading...
</div>

<a class="button"
href="https://gmhc.link/NugentSeries"
target="_blank">
Join on Zoom
</a>

<div class="footer">

<div class="event-date">
Thursday 3 September 2026
</div>

<div class="event-time">
8:00 PM (Perth • Singapore • Malaysia • Hong Kong)
</div>

</div>

</div>

</div>

<script>

const seminarDate = new Date("2026-09-03T20:00:00+08:00");

function updateCountdown(){

const now = new Date();

const diff = seminarDate - now;

if(diff<=0){

document.getElementById("countdown").innerHTML="LIVE NOW";

return;

}

const days=Math.floor(diff/86400000);

const hours=Math.floor((diff%86400000)/3600000);

const mins=Math.floor((diff%3600000)/60000);

const secs=Math.floor((diff%60000)/1000);

document.getElementById("countdown").innerHTML=

days+" days "

+hours+" hrs "

+mins+" min "

+secs+" sec";

}

setInterval(updateCountdown,1000);

updateCountdown();

</script>

</body>
</html>
